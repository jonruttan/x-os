name: CI

# A pull request builds the container and the bootable image for both
# architectures and tests each: the shell in the container, a boot of the
# kernel and the initramfs under QEMU, and a boot of the ISO image, each
# ending with the guest powering itself down.  A push to main does the same
# and then publishes the container to Docker Hub and the ISO images as the
# release named latest.
#
# Each architecture builds on a runner of its own kind, so nothing is built
# under emulation.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install QEMU and expect
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-system-arm expect ovmf qemu-efi-aarch64
      # The runner's own virtualization, where it has any: the boot test uses
      # /dev/kvm when it can write to it and emulates when it cannot.
      - name: Allow KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
      - name: Container
        run: make test-container ARCH=${{ matrix.arch }}
      - name: Boot
        run: make test-boot ARCH=${{ matrix.arch }}
        env:
          BOOT_MEM: "3072"
      - name: ISO image
        run: make test-iso ARCH=${{ matrix.arch }}
        env:
          BOOT_MEM: "3072"
      - name: Keep the ISO image
        uses: actions/upload-artifact@v4
        with:
          name: x-os-iso-${{ matrix.arch }}
          path: build/iso-${{ matrix.arch }}/x-os-${{ matrix.arch }}.iso
          if-no-files-found: error
      - name: Keep the bootable image
        uses: actions/upload-artifact@v4
        with:
          name: x-os-boot-${{ matrix.arch }}
          path: build/boot-${{ matrix.arch }}
          if-no-files-found: error

  # Each architecture is built on a runner of its own kind and pushed by
  # digest; publish joins the two under the tags.  An emulated build of the
  # other architecture takes over an hour.
  push:
    name: push (${{ matrix.arch }})
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      # A repository without the two secrets builds and tests and publishes
      # nothing, and says so.
      - name: Are there credentials
        id: creds
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "No DOCKERHUB_USERNAME and DOCKERHUB_TOKEN: nothing is published."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.have == '1'
      - name: Fetch the pinned sources
        if: steps.creds.outputs.have == '1'
        run: make fetch
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.have == '1'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.have == '1'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        if: steps.creds.outputs.have == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: root
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/x-os,push-by-digest=true,name-canonical=true,push=true
      - name: Note the digest
        if: steps.creds.outputs.have == '1'
        run: |
          mkdir -p build/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "build/digests/${digest#sha256:}"
      - name: Keep the digest
        if: steps.creds.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: x-os-digest-${{ matrix.arch }}
          path: build/digests/*
          if-no-files-found: error

  publish:
    name: publish
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Are there credentials
        id: creds
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "No DOCKERHUB_USERNAME and DOCKERHUB_TOKEN: nothing is published."
          fi
      - name: Fetch the digests
        if: steps.creds.outputs.have == '1'
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: x-os-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.have == '1'
      - uses: docker/login-action@v3
        if: steps.creds.outputs.have == '1'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Join the architectures under the tags
        if: steps.creds.outputs.have == '1'
        working-directory: digests
        run: |
          if [ "$(ls | wc -l)" -ne 2 ]; then
            echo "expected two digests, have: $(ls)" >&2
            exit 1
          fi
          image="$DOCKERHUB_USERNAME/x-os"
          docker buildx imagetools create \
            -t "$image:latest" -t "$image:${{ github.sha }}" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:latest"

  # The repository on Docker Hub says what the image is.  A job of its own, so
  # that a token not allowed to change a repository fails this and nothing
  # else.
  describe:
    name: describe
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Are there credentials
        id: creds
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
          else
            echo "No DOCKERHUB_USERNAME and DOCKERHUB_TOKEN: nothing is described."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.have == '1'
      - name: Describe the repository
        if: steps.creds.outputs.have == '1'
        run: |
          sh tools/hub-describe.sh docs/docker-hub.md \
            "The Linux kernel, x and its languages: x-ash as the shell, x-coreutils as its commands."

  # The ISO images the test jobs built and booted, as the assets of one
  # release whose tag moves to the commit they were built from.
  release:
    name: release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the ISO images
        uses: actions/download-artifact@v4
        with:
          path: iso
          pattern: x-os-iso-*
          merge-multiple: true
      - name: Publish the release
        working-directory: iso
        run: |
          if [ ! -s x-os-amd64.iso ] || [ ! -s x-os-arm64.iso ]; then
            echo "expected two ISO images, have: $(ls)" >&2
            exit 1
          fi
          sha256sum x-os-amd64.iso x-os-arm64.iso > SHA256SUMS
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest --target "$GITHUB_SHA" --title "x-os" \
            --notes "The bootable ISO images, built from $GITHUB_SHA." \
            x-os-amd64.iso x-os-arm64.iso SHA256SUMS
